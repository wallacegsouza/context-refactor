[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-refactor"
version = "0.1.0"
description = "Semantic, technology-aware codebase refactoring for LLM context windows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ContextRefactor Contributors" }]

dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
context-refactor = "cli.main:main"

[tool.setuptools.packages.find]
include = ["context_refactor*", "mcp_server*", "cli*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
