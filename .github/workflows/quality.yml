name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,mcp]"
      
      - name: Check code style with ruff
        run: |
          ruff check context_refactor tests cli mcp_server token_report.py --output-format=grouped
      
      - name: Format check
        run: |
          ruff format --check context_refactor tests cli mcp_server token_report.py 2>&1 | head -20 || echo "Format issues detected (not blocking)"
      
      - name: Check for unused imports
        run: |
          python -m ruff check --select F401 context_refactor mcp_server cli

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      
      - name: Run security scan
        run: |
          bandit -r context_refactor mcp_server cli -ll || echo "Bandit scan completed"
