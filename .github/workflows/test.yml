name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      
      - name: Lint with ruff
        run: |
          ruff check context_refactor tests cli mcp_server
      
      - name: Type check with mypy
        run: |
          mypy context_refactor mcp_server cli --ignore-missing-imports --no-error-summary 2>&1 | grep -i "error" | head -20 || echo "✓ Type checking complete"
      
      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short --cov=context_refactor --cov=mcp_server --cov=cli
      
      - name: Validate CLI entry point
        run: |
          context-refactor --help | grep -q "Usage" && echo "✓ CLI working"
      
      - name: Validate MCP server import
        run: |
          python -c "from mcp_server.server import main; print('✓ MCP server importable')"
      
      - name: Validate analyzer core
        run: |
          python -c "from context_refactor.analyzer import analyze_tokens; print('✓ Core analyzer importable')"
      
      - name: Test clean installation
        run: |
          python -m venv /tmp/clean_venv
          /tmp/clean_venv/bin/pip install --upgrade pip
          /tmp/clean_venv/bin/pip install -e .
          /tmp/clean_venv/bin/python -c "import context_refactor; print('✓ Package importable in clean venv')"
          /tmp/clean_venv/bin/context-refactor --help | grep -q "Usage" && echo "✓ CLI available in clean venv"
